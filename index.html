<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presidential Suite — The Grand Lotte Seoul · 3D Room Tour</title>
<!-- Typography follows lottehotel.com:
     body/UI  : Pretendard Variable (KO), Pretendard JP Variable (JA), Noto Sans SC (ZH)
     titles   : times-new-roman (Lotte's Adobe Fonts kit; falls back to the system Times New Roman)
     labels   : anth (Lotte's Adobe Fonts kit; falls back to Cormorant Garamond)
     When hosted on lottehotel.com the site's own kit supplies anth / times-new-roman automatically. -->
<link rel="stylesheet" href="fonts/pretendard.css">
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js" data-disable-auto-track="1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root { --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
           --serif:"times-new-roman","Times New Roman",Times,var(--sans);
           --label:anth,"Cormorant Garamond","Times New Roman",var(--sans); }
  html[lang=ja] { --sans:"Pretendard JP Variable","Pretendard Variable",-apple-system,"Hiragino Sans",system-ui,sans-serif; }
  html[lang=zh] { --sans:"Noto Sans SC","Pretendard Variable",-apple-system,"PingFang SC",system-ui,sans-serif; }
  :root { --ink:#f4efe6; --mute:rgba(244,239,230,.64); --glass:rgba(22,20,18,.6); --line:rgba(244,239,230,.16); --gold:#c9a86a; --gold2:#e3c58a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; background:#151311; font-family:var(--sans); -webkit-font-smoothing:antialiased; color:var(--ink); }
  canvas#c { display:block; width:100vw; height:100vh; outline:none; touch-action:none; }
  button { font:inherit; color:inherit; }
  button:focus-visible, a:focus-visible { outline:2px solid var(--gold2); outline-offset:2px; }
  .vig { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(10,8,6,.32) 100%); }
  .shade { position:fixed; left:0; right:0; top:0; height:140px; pointer-events:none; background:linear-gradient(rgba(20,18,16,.5),rgba(20,18,16,0)); }
  .glass { background:var(--glass); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); }
  .ui { transition:opacity .5s; } body.intro .ui { opacity:0; pointer-events:none; }
  .brand { position:fixed; top:22px; left:26px; pointer-events:none; }
  .brand .s { font-family:var(--label); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
  .brand .t { font-family:var(--serif); letter-spacing:.02em; font-size:30px; font-weight:400; margin-top:2px; text-shadow:0 1px 12px rgba(0,0,0,.35); }
  .room { position:fixed; top:20px; right:26px; text-align:right; }
  .lang { display:inline-flex; gap:2px; padding:3px; border-radius:999px; }
  .lang button { background:none; border:0; font-size:11px; letter-spacing:.08em; padding:4px 9px; border-radius:999px; cursor:pointer; color:var(--mute); }
  .lang button.on { background:var(--ink); color:#1b1916; }
  .room .k { font-family:var(--label); font-size:12px; letter-spacing:.16em; color:var(--gold); text-transform:uppercase; margin-top:10px; }
  .room .n { font-family:var(--serif); letter-spacing:.02em; font-size:24px; margin-top:2px; transition:opacity .3s; text-shadow:0 1px 10px rgba(0,0,0,.4); }

  /* minimap */
  #plan { position:fixed; left:22px; bottom:22px; width:250px; border-radius:16px; padding:10px 12px 8px; }
  #plan .h { display:flex; justify-content:space-between; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute); margin-bottom:6px; }
  #plan svg { display:block; width:100%; height:auto; overflow:visible; }
  #plan .rm { fill:rgba(244,239,230,.06); stroke:rgba(244,239,230,.35); stroke-width:.08; cursor:pointer; transition:fill .2s; }
  #plan .rm:hover { fill:rgba(244,239,230,.16); }
  #plan .rm.on { fill:rgba(201,168,106,.28); stroke:var(--gold2); }
  #plan .lb { font-size:.62px; fill:rgba(244,239,230,.8); pointer-events:none; text-anchor:middle; }
  #plan .win { stroke:#9fc3e6; stroke-width:.16; }
  #plan .dot { fill:var(--gold2); cursor:pointer; } #plan .dot:hover { r:.34; }
  #plan .me { fill:#fff; } #plan .cone { fill:rgba(255,255,255,.28); }

  /* bottom centre: scenes + tour */
  #dock { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); display:flex; gap:8px; align-items:center; }
  .sc { display:flex; gap:3px; padding:4px; border-radius:999px; }
  .sc button { background:none; border:0; font-size:12px; padding:8px 12px; border-radius:999px; cursor:pointer; white-space:nowrap; }
  .sc button:hover { background:rgba(244,239,230,.1); }
  .sc button.on { background:var(--gold); color:#1b1916; }
  .pill { border-radius:999px; padding:10px 16px; font-size:12px; cursor:pointer; white-space:nowrap; }
  #tourBtn { border-color:rgba(227,197,138,.6); color:var(--gold2); }
  #tourBtn::before { content:'▶  '; font-size:10px; }

  /* tour caption — compact, bottom-docked, description folds away after a few seconds */
  #cap { position:fixed; left:50%; bottom:22px; transform:translate(-50%,10px); width:min(500px,calc(100vw - 24px)); border-radius:16px; padding:10px 14px 9px; opacity:0; pointer-events:none; transition:opacity .35s, transform .35s; cursor:default; }
  body.touring #cap { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  body.touring #dock { opacity:0; pointer-events:none; }
  #dock { transition:opacity .3s; }
  #cap .hd { display:flex; align-items:baseline; gap:10px; }
  #cap .st { font-size:10px; letter-spacing:.16em; color:var(--gold); white-space:nowrap; }
  #cap h3 { font-family:var(--serif); letter-spacing:.02em; font-weight:400; font-size:17px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #cap p { font-size:12.5px; line-height:1.55; color:rgba(244,239,230,.84); margin-top:4px; max-height:60px; overflow:hidden; transition:max-height .45s, opacity .35s, margin .35s; }
  #cap.min p { max-height:0; opacity:0; margin-top:0; }
  #cap:hover p { max-height:60px; opacity:1; margin-top:4px; }
  #cap .ctl { display:flex; align-items:center; gap:5px; margin-top:7px; }
  #cap .ctl button { background:none; border:1px solid var(--line); border-radius:999px; width:28px; height:24px; cursor:pointer; font-size:11px; line-height:1; }
  #cap .ctl #tX { width:auto; padding:0 10px; margin-left:auto; font-size:10.5px; color:var(--mute); }
  #cap .prog { display:flex; gap:3px; flex:1; margin:0 6px; }
  #cap .prog i { flex:1; height:2px; border-radius:2px; background:rgba(244,239,230,.18); overflow:hidden; position:relative; }
  #cap .prog i.done { background:var(--gold); }
  #cap .prog i b { position:absolute; inset:0; width:0; background:var(--gold2); }
  @media (max-width:1150px){ body.touring #plan, body.touring #br { opacity:0; pointer-events:none; } #br{ transition:opacity .3s; } }

  /* bottom right: info pill + more */
  #br { position:fixed; right:22px; bottom:22px; display:flex; gap:8px; align-items:flex-end; }
  #info { border-radius:18px; overflow:hidden; width:auto; transition:width .3s; }
  #info .top { display:flex; align-items:center; gap:10px; padding:6px 6px 6px 16px; }
  #info #infoToggle { background:none; border:0; cursor:pointer; text-align:left; font-size:12px; }
  #info #infoToggle b { color:var(--gold2); font-weight:500; }
  .cta { display:inline-block; text-align:center; text-decoration:none; color:#1b1916; background:linear-gradient(180deg,var(--gold2),var(--gold)); padding:9px 16px; border-radius:999px; font-size:12px; font-weight:500; white-space:nowrap; }
  .cta:hover { filter:brightness(1.06); }
  #info .body { display:none; padding:4px 16px 16px; width:290px; }
  #info.open .body { display:block; }
  #info dl { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; margin-bottom:12px; }
  #info dt { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
  #info dd { font-size:14px; margin-top:2px; }
  #info .wide { grid-column:1 / -1; }
  #chips { display:flex; flex-wrap:wrap; gap:5px; }
  #chips span { font-size:11px; padding:4px 9px; border-radius:999px; border:1px solid var(--line); color:var(--mute); }
  #more { position:relative; }
  #moreBtn { width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:18px; letter-spacing:.05em; }
  #menu { position:absolute; right:0; bottom:54px; width:200px; border-radius:14px; padding:6px; display:none; }
  #menu.open { display:block; }
  #menu button { display:flex; justify-content:space-between; width:100%; background:none; border:0; padding:9px 10px; border-radius:9px; font-size:12px; cursor:pointer; text-align:left; }
  #menu button:hover { background:rgba(244,239,230,.08); }
  #menu button span:last-child { color:var(--mute); }
  #menu button.on span:last-child { color:var(--gold2); }

  /* hotspots */
  #hs { position:fixed; inset:0; pointer-events:none; }
  .hsp { position:absolute; left:-15px; top:-15px; width:30px; height:30px; border-radius:50%; border:0; background:rgba(255,250,240,.94); box-shadow:0 2px 12px rgba(0,0,0,.35); cursor:pointer; pointer-events:auto; opacity:0; visibility:hidden; transition:opacity .25s; }
  .hsp.vis { opacity:1; visibility:visible; }
  body.touring .hsp { opacity:0 !important; visibility:hidden !important; }
  .hsp i::before { content:'+'; font-style:normal; font-size:18px; line-height:30px; color:#7a5d2c; }
  .hsp::before { content:attr(data-label); position:absolute; left:50%; bottom:38px; transform:translateX(-50%) translateY(4px); white-space:nowrap; font-size:12px; padding:5px 10px; border-radius:999px; background:rgba(22,20,18,.82); color:var(--ink); opacity:0; transition:all .2s; pointer-events:none; }
  .hsp:hover::before, .hsp:focus-visible::before { opacity:1; transform:translateX(-50%); }
  .hsp::after { content:''; position:absolute; inset:-6px; border-radius:50%; border:1.5px solid rgba(255,250,240,.7); animation:pulse 2.2s ease-out infinite; }
  @keyframes pulse { 0%{ transform:scale(.7); opacity:1 } 100%{ transform:scale(1.5); opacity:0 } }

  /* hotspot card */
  #card { position:fixed; right:22px; bottom:84px; width:330px; border-radius:18px; padding:18px 18px 14px; opacity:0; transform:translateY(10px); pointer-events:none; transition:opacity .3s, transform .3s; }
  #card.show { opacity:1; transform:none; pointer-events:auto; }
  #card .no { font-size:10px; letter-spacing:.2em; color:var(--gold); }
  #card h3, #cap h3 { line-break:strict; word-break:keep-all; overflow-wrap:anywhere; }
  #card h3 { font-family:var(--serif); letter-spacing:.02em; font-weight:400; font-size:21px; margin:2px 0 6px; padding-right:24px; }
  #card p { font-size:13px; line-height:1.65; color:rgba(244,239,230,.84); margin-bottom:12px; }
  #card .sc { margin-bottom:12px; flex-wrap:wrap; background:rgba(0,0,0,.25); border-radius:14px; }
  #card .row { display:flex; gap:6px; align-items:center; }
  #cardX { position:absolute; right:12px; top:10px; background:none; border:0; font-size:20px; color:var(--mute); cursor:pointer; }
  #card .row button { background:none; border:1px solid rgba(244,239,230,.35); border-radius:999px; padding:7px 12px; font-size:12px; cursor:pointer; }
  #card .row .nav { margin-left:auto; width:32px; padding:7px 0; }

  #toast { position:fixed; left:50%; top:24px; transform:translate(-50%,-10px); padding:10px 18px; border-radius:999px; font-size:12px; opacity:0; transition:all .3s; pointer-events:none; max-width:calc(100vw - 40px); text-align:center; z-index:5; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #perf { position:fixed; left:50%; top:60px; z-index:20; transform:translateX(-50%); font:11px/1.5 ui-monospace,Menlo,monospace; padding:6px 10px; border-radius:8px; display:none; z-index:6; white-space:pre; }
  #perf.on { display:block; }

  /* intro */
  #intro { position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:radial-gradient(ellipse at 50% 40%, rgba(40,34,28,.55), rgba(14,12,10,.96) 70%), #151311; transition:opacity .9s; }
  #intro.gone { opacity:0; pointer-events:none; }
  #intro .in { text-align:center; padding:24px; max-width:520px; }
  #intro .s { font-family:var(--label); font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); }
  #intro h1 { font-family:var(--serif); letter-spacing:.02em; font-weight:400; font-size:clamp(30px,5vw,50px); word-break:keep-all; margin:10px 0 6px; }
  #intro .meta { font-size:13px; color:var(--mute); }
  #intro .bar { width:220px; height:2px; background:rgba(244,239,230,.15); margin:34px auto 10px; border-radius:2px; overflow:hidden; }
  #intro .bar i { display:block; height:100%; width:0; background:var(--gold2); transition:width .3s; }
  #intro .lbl { font-size:11px; letter-spacing:.12em; color:var(--mute); height:16px; }
  #intro .go { display:flex; gap:10px; justify-content:center; margin-top:26px; opacity:0; transition:opacity .5s; pointer-events:none; }
  #intro.ready .go { opacity:1; pointer-events:auto; } #intro.ready .bar, #intro.ready .lbl { opacity:0; }
  #intro .go button { border-radius:999px; padding:12px 22px; font-size:13px; cursor:pointer; }
  #intro .go .cta { border:0; padding:12px 24px; font-size:13px; }
  #intro .lang { margin-top:30px; }
  #intro .privacy { margin:22px auto 0; max-width:440px; font-size:11px; line-height:1.6; color:rgba(255,255,255,.42); word-break:keep-all; }

  @media (max-width:860px){
    .brand .t{font-size:19px} .brand .s{font-size:9px} .brand{left:14px; top:14px; max-width:calc(100vw - 210px)} .room{right:12px; top:12px} .room .n{font-size:17px} .room .k{margin-top:6px; font-size:9px}
    #toast{ top:auto; bottom:150px; border-radius:16px; }
    #plan{ left:10px; bottom:64px; width:160px; padding:6px 8px 4px; } #plan .h{ display:none; }
    #dock{ bottom:12px; width:calc(100vw - 20px); justify-content:center; } #dock .sc{ overflow-x:auto; scrollbar-width:none; } .sc button{ padding:7px 9px; font-size:11px; }
    #tourBtn{ padding:9px 12px; font-size:11px; }
    #br{ right:10px; bottom:64px; flex-direction:column-reverse; align-items:flex-end; } #moreBtn{ width:40px; height:40px; }
    #info .body{ width:min(290px,calc(100vw - 20px)); } #info .top{ padding:5px 5px 5px 12px; } #info #infoToggle{ font-size:11px; }
    #card{ left:10px; right:10px; width:auto; bottom:64px; }
    #cap{ bottom:12px; }
    body.card-open #plan, body.card-open #br, body.touring #plan { opacity:0; pointer-events:none; }
    #plan{ width:140px; transition:opacity .3s; } #br{ transition:opacity .3s; }
  }
  @media (max-width:430px){ #info .rnm{ display:none; } }
  @media (prefers-reduced-motion: reduce){ .hsp::after{ animation:none; } }
</style>

<body class="intro">
<canvas id="c" tabindex="0"></canvas>
<div class="vig"></div><div class="shade"></div>
<div id="hs" class="ui"></div>
<div class="brand ui"><div class="s" id="hotel"></div><div class="t" id="roomName"></div></div>
<div class="room ui">
  <div class="lang glass"><button data-l="ko">KO</button><button data-l="en">EN</button><button data-l="ja">JA</button><button data-l="zh">中文</button></div>
  <div class="k" id="tod"></div><div class="n" id="rn"></div>
</div>

<div id="plan" class="glass ui"><div class="h"><span data-i="ui.plan"></span><span id="planZone"></span></div><svg id="planSvg"></svg></div>

<div id="dock" class="ui">
  <div id="scenes" class="sc glass"><button data-s="welcome" data-i="scene.welcome"></button><button data-s="day" data-i="scene.day"></button><button data-s="evening" data-i="scene.evening"></button><button data-s="turndown" data-i="scene.turndown"></button><button data-s="sleep" data-i="scene.sleep"></button></div>
  <button id="tourBtn" class="pill glass" data-i="ui.tourStart"></button>
</div>

<div id="cap" class="glass">
  <div class="hd"><div class="st" id="capStep"></div><h3 id="capT"></h3></div><p id="capD"></p>
  <div class="ctl"><button id="tPrev" aria-label="prev">‹</button><button id="tPlay" aria-label="pause">❚❚</button><button id="tNext" aria-label="next">›</button><div class="prog" id="tProg"></div><button id="tX" data-i="ui.exit"></button></div>
</div>

<div id="br" class="ui">
  <div id="more"><button id="moreBtn" class="glass" aria-label="more">⋯</button>
    <div id="menu" class="glass">
      <button id="mSound"><span data-i="ui.sound"></span><span class="v">OFF</span></button>
      <button id="mHQ" class="on"><span data-i="ui.quality"></span><span class="v"></span></button>
      <button id="mFS"><span data-i="ui.fs"></span><span>⤢</span></button>
      <button id="mGyro" style="display:none"><span data-i="ui.gyro"></span><span class="v">OFF</span></button>
      <button id="mPerf"><span data-i="ui.perf"></span><span class="v">OFF</span></button>
    </div>
  </div>
  <aside id="info" class="glass">
    <div class="body">
      <dl>
        <div><dt data-i="ui.area"></dt><dd id="iArea"></dd></div>
        <div><dt data-i="ui.bed"></dt><dd id="iBed"></dd></div>
        <div><dt data-i="ui.guests"></dt><dd id="iGuests"></dd></div>
        <div><dt data-i="ui.floor"></dt><dd id="iFloor"></dd></div>
        <div class="wide"><dt data-i="ui.view"></dt><dd id="iView"></dd></div>
      </dl>
      <div id="chips"></div>
    </div>
    <div class="top"><button id="infoToggle"></button><a id="book" class="cta" href="#" target="_blank" rel="noopener" data-i="ui.bookShort"></a></div>
  </aside>
</div>

<div id="card" class="glass">
  <button id="cardX" aria-label="close">×</button>
  <div class="no" id="cardNo"></div><h3 id="cardT"></h3><p id="cardD"></p>
  <div id="cardScenes" class="sc"><button data-s="welcome" data-i="scene.welcome"></button><button data-s="day" data-i="scene.day"></button><button data-s="evening" data-i="scene.evening"></button><button data-s="turndown" data-i="scene.turndown"></button><button data-s="sleep" data-i="scene.sleep"></button></div>
  <div class="row"><button id="cardGo" data-i="ui.closer"></button><button class="nav" id="cardPrev" aria-label="prev">‹</button><button class="nav" id="cardNext" aria-label="next" style="margin-left:0">›</button></div>
</div>

<div id="toast" class="glass"></div>
<div id="perf" class="glass"></div>

<div id="intro">
  <div class="in">
    <div class="s" id="introHotel"></div>
    <h1 id="introRoom"></h1>
    <div class="meta" id="introMeta"></div>
    <div class="bar"><i id="introBar"></i></div>
    <div class="lbl" id="introLbl"></div>
    <div class="go"><button id="introTour" class="cta" data-i="ui.tourStart"></button><button id="introFree" class="glass" data-i="ui.explore"></button></div>
    <p class="privacy" data-i="ui.privacy"></p>
    <div class="lang glass"><button data-l="ko">KO</button><button data-l="en">EN</button><button data-l="ja">JA</button><button data-l="zh">中文</button></div>
  </div>
</div>

<script type="module" src="assets/app.JV7ZTYGV.js"></script>
</body>
</html>
